<div class="create-container">
  <div class="create-left">
    <img src="assets/images/bikeshare-logo.png" alt="BikeShare logo">
    <h1>Welcome to BikeShare</h1>
    <p class="tagline">Your city, your ride.</p>
  </div>
  <div class="create-right">
    <h2>Create your account</h2>
    <p class="subtitle">It’s free and easy</p>

    <div class="form-group">
      <label>Full name</label>
      <input type="text" placeholder="Enter your name" [(ngModel)]="fullName">
    </div>

    <div class="form-group">
      <label>E-mail or phone number</label>
      <input type="text" placeholder="Type your e-mail or phone number" [(ngModel)]="emailOrPhone">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" placeholder="Type your password" [(ngModel)]="password">
      <small>Must be 8 characters at least</small>
    </div>

    <div class="form-group terms">
      <input id="terms" type="checkbox" [(ngModel)]="agreeTerms">
      <label for="terms">
        By creating an account you agree to the
        <a href="#">Terms and Conditions</a> and our
        <a href="#">Privacy Policy</a>.
      </label>
    </div>

    <button class="btn-create" (click)="createAccount()" [disabled]="!agreeTerms">
      Create Account
    </button>

    <div class="other-login">
      <hr><span>or do it via other accounts</span><hr>
      <div class="icons">
        <i class="pi pi-google"></i>
        <i class="pi pi-apple"></i>
        <i class="pi pi-facebook"></i>
      </div>
    </div>

    <p class="signin-link">
      Already have an account? <a (click)="goToSignIn()">Sign In</a>
    </p>
  </div>
</div>
