<div class="login-container">
  <div class="login-left">
    <img src="assets/images/bikeshare-logo.png" alt="BikeShare logo">
    <h1>Welcome to BikeShare</h1>
    <p class="tagline">Your city, your ride.</p>
  </div>
  <div class="login-right">
    <div class="form-group">
      <label for="email">E‑mail or phone number</label>
      <input id="email" type="text" placeholder="Type your e‑mail or phone number" [(ngModel)]="emailOrPhone">
    </div>
    <div class="form-group password-group">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Type your password" [(ngModel)]="password">
      <a class="forgot" (click)="forgotPassword()">Forgot Password?</a>
    </div>
    <button class="btn-signin" (click)="signIn()">Sign In</button>
    <div class="other-login">
      <span>or do it via other accounts</span>
      <div class="icons">
        <i class="icon-google">G</i>
        <i class="icon-apple"></i>
        <i class="icon-facebook">f</i>
      </div>
    </div>
    <div class="signup-link">
      Don’t have an account? <a (click)="signUp()">Sign Up</a>
    </div>
    <button class="btn-tech" (click)="applyTechnician()">
      RepairLink technician? Sign In or Apply here
    </button>
  </div>
</div>
