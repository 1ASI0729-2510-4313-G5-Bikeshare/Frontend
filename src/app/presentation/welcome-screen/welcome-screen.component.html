<div class="welcome-container">
  <div class="welcome-left">
    <img src="assets/images/bikeshare-logo.png" alt="BikeShare logo">
    <h1>Welcome to BikeShare</h1>
    <p class="tagline">Your city, your ride.</p>
  </div>
  <div class="welcome-right">
    <button (click)="goAlquilar()" class="btn">
      Deseo alquilar <span class="arrow">›</span>
    </button>
    <button (click)="goRentar()" class="btn">
      Deseo rentar <span class="arrow">›</span>
    </button>
  </div>
</div>
